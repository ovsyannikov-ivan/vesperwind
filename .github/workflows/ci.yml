name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    frontend:
        name: Frontend
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Build frontend
              run: npm run build

            - name: Check whitespace errors
              run: git diff --check

    rust-macos:
        name: Rust / macOS
        runs-on: macos-14

        defaults:
            run:
                working-directory: src-tauri

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@1.99.0
              with:
                  components: rustfmt

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install frontend reader dependencies for native acceptance
              working-directory: .
              run: npm ci

            - name: Build bundled archive worker and test disk limits
              working-directory: .
              run: npm run build:archives

            - name: Build and verify pinned thumbnail FFmpeg
              working-directory: .
              env:
                  VESPERWIND_THUMBNAIL_BUILD_DIR: ${{ runner.temp }}/vesperwind-thumbnail-ffmpeg
              run: |
                  bash scripts/build-thumbnail-ffmpeg.sh
                  node scripts/check-thumbnail-ffmpeg.mjs

            - name: Verify bundled libmpv including HTTP HTTPS and HLS
              working-directory: .
              run: node scripts/verify-libmpv-bundle.js

            - name: Verify pinned LOWA payload
              working-directory: .
              run: node scripts/check-lowa-assets.mjs

            - name: Check formatting
              run: cargo fmt --check

            - name: Run tests
              env:
                  # CI has no physical audio device; decode/output timing still runs in libmpv.
                  VESPERWIND_MPV_SMOKE_AO: "null"
              run: cargo test

            - name: Run real thumbnail extraction and cancellation
              run: cargo test media::thumbnail::tests::real -- --ignored --nocapture

            - name: Run real archive workflow
              run: cargo test real_archive_workflow -- --ignored

            - name: Build native Office regression executable
              run: cargo build

            - name: Native WKWebView Office and deletion acceptance
              working-directory: .
              run: node scripts/native-smoke.mjs "$RUNNER_TEMP/vesperwind-native-acceptance"

            - name: Upload native acceptance diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: native-macos-office-acceptance
                  path: ${{ runner.temp }}/vesperwind-native-acceptance

    rust-windows:
        name: Rust / Windows
        runs-on: windows-latest

        defaults:
            run:
                working-directory: src-tauri

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@1.99.0
              with:
                  components: rustfmt

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install frontend reader dependencies for native acceptance
              working-directory: .
              run: npm ci

            - name: Build bundled archive worker and test disk limits
              working-directory: .
              run: npm run build:archives

            - name: Verify bundled libmpv including HTTP HTTPS and HLS
              working-directory: .
              run: node scripts/verify-libmpv-bundle.js

            - name: Verify pinned LOWA payload
              working-directory: .
              run: node scripts/check-lowa-assets.mjs

            - name: Check formatting
              run: cargo fmt --check

            - name: Run tests
              env:
                  # CI has no physical audio device; decode/output timing still runs in libmpv.
                  VESPERWIND_MPV_SMOKE_AO: "null"
              run: cargo test

            - name: Run real archive workflow
              run: cargo test real_archive_workflow -- --ignored

            - name: Build native Office regression executable
              run: cargo build

            - name: Native WebView2 Office and deletion acceptance
              working-directory: .
              shell: powershell
              run: ./scripts/run-native-smoke.ps1 -Output "$env:RUNNER_TEMP/vesperwind-native-acceptance"

            - name: Upload native acceptance diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: native-windows-office-acceptance
                  path: ${{ runner.temp }}/vesperwind-native-acceptance

name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    frontend:
        name: Frontend
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Build frontend
              run: npm run build

            - name: Check whitespace errors
              run: git diff --check

    rust-macos:
        name: Rust / macOS
        runs-on: macos-14

        defaults:
            run:
                working-directory: src-tauri

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@1.99.0
              with:
                  components: rustfmt

            - name: Check formatting
              run: cargo fmt --check

            - name: Run tests
              run: cargo test

    rust-windows:
        name: Rust / Windows
        runs-on: windows-latest

        defaults:
            run:
                working-directory: src-tauri

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@1.99.0
              with:
                  components: rustfmt

            - name: Run tests
              run: cargo test

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#323232" />
    <script>
      (() => {
        const storedTheme = localStorage.getItem('vesperwind:theme')
        const theme = ['dark', 'light'].includes(storedTheme)
          ? storedTheme
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        document.documentElement.setAttribute('data-bs-theme', theme)
      })()
    </script>
    <meta
      name="description"
      content="Vesperwind — a fast, two-panel browser file manager for your local filesystem."
    />
    <title>Vesperwind File Manager</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

[package]
name = "vesperwind"
version = "0.1.0"
description = "Vesperwind native desktop backend"
authors = ["Vesperwind contributors"]
edition = "2021"

[lib]
name = "vesperwind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
filetime = "0.2"
path-clean = "1"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["block2", "NSError", "NSFileCoordinator", "NSFileManager", "NSString", "NSURL"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

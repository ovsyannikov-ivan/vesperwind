[package]
name = "vesperwind"
version = "0.1.0"
description = "Vesperwind native desktop backend"
authors = ["Vesperwind contributors"]
edition = "2021"

[lib]
name = "vesperwind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
dirs = "6"
filetime = "0.2"
path-clean = "1"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSColor", "NSGraphics", "NSOpenGL", "NSOpenGLView", "NSResponder", "NSScreen", "NSView", "NSWindow", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["block2", "NSData", "NSError", "NSFileCoordinator", "NSFileManager", "NSString", "NSURL"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "objc2-core-foundation"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61", features = ["Win32_Devices_Display", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

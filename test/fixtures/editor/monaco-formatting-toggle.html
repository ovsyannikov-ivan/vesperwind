<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Prettier availability regression checks</title>
<style>#host{height:300px;display:flex}body{font:14px system-ui;margin:20px}#results{white-space:pre-wrap}</style></head>
<body><h1>Prettier availability regression checks</h1><pre id="results">Running…</pre><div id="app"></div>
<script type="module">
import * as monaco from 'monaco-editor'
import 'bootstrap/dist/css/bootstrap.min.css'
import '../../../src/styles/main.scss'
import { createApp, ref, h, nextTick } from 'vue'
import MonacoEditor from '../../../src/components/MonacoEditor.vue'
import SettingsModal from '../../../src/components/SettingsModal.vue'
import { settings } from '../../../src/composables/settingsState.js'
import { StandaloneServices } from 'monaco-editor/editor/standalone/browser/standaloneServices.js'
import { ILanguageFeaturesService } from 'monaco-editor/editor/common/services/languageFeatures.js'

settings.value.editor.formatting.enabled = false
const tab = ref({ id: 'toggle', type: 'text', filesystemId: 'local', filePath: '/qa/toggle.js',
  fileName: 'toggle.js', language: 'javascript', content: 'const x={a:1}', savedContent: 'const x={a:1}',
  loading: false, saving: false, formatting: false })
const component = ref(null)
const app = createApp({ setup: () => () => h('div', [
  h('div', { id: 'host' }, [h(MonacoEditor, { ref: component, tabs: [tab.value], activeTab: tab.value,
    onChange: (_id, content) => { tab.value.content = content } })]),
  h(SettingsModal),
]) })
app.mount('#app')
await nextTick()
const editor = monaco.editor.getEditors().find(item => item.getDomNode()?.closest('#host'))
const model = editor.getModel()
const features = StandaloneServices.get(ILanguageFeaturesService)
const providers = () => features.documentFormattingEditProvider.ordered(model).filter(item => item.displayName === 'Prettier')
const assert = (condition, message) => { if (!condition) throw Error(message) }
const results = []
const test = async (name, fn) => {
  try { await fn(); results.push(`PASS ${name}`) } catch (error) { results.push(`FAIL ${name}: ${error.stack}`) }
  document.querySelector('#results').textContent = results.join('\n')
}
await test('disabled mount: no Prettier provider, action or manual formatting', async () => {
  const version = model.getVersionId()
  assert(providers().length === 0, 'provider registered while disabled')
  assert(!editor.getAction('vesperwind.formatDocument').isSupported(), 'action is available')
  await component.value.formatDocument()
  assert(model.getVersionId() === version && !model.canUndo(), 'disabled manual format changed model/history')
})
await test('live enable/disable preserves the model, selection, manual indentation and undo/redo', async () => {
  model.updateOptions({ tabSize: 8, insertSpaces: false })
  editor.setSelection(new monaco.Selection(1, 1, 1, 8))
  settings.value.editor.formatting.enabled = true
  await nextTick()
  assert(providers().length === 1 && editor.getAction('vesperwind.formatDocument').isSupported(), 'enable did not restore formatting')
  const oldProvider = providers()[0]
  assert((await oldProvider.provideDocumentFormattingEdits(model, {}, new monaco.CancellationTokenSource().token)).length === 1,
    'reenabled provider did not produce edits')
  await component.value.formatDocument()
  assert(tab.value.content === 'const x = { a: 1 };\n', 'manual format failed')
  assert(editor.getModel() === model && model.getOptions().tabSize === 8 && !model.getOptions().insertSpaces, 'model/indentation changed')
  const selection = editor.getSelection().toString()
  settings.value.editor.formatting.enabled = false
  await nextTick()
  assert(providers().length === 0 && !editor.getAction('vesperwind.formatDocument').isSupported(), 'disable did not remove formatting')
  assert(editor.getSelection().toString() === selection, 'toggle moved selection')
  assert((await oldProvider.provideDocumentFormattingEdits(model, {}, new monaco.CancellationTokenSource().token)).length === 0, 'stale provider formatted')
  await model.undo()
  assert(tab.value.content === 'const x={a:1}', 'Undo after disabling lost original text')
  settings.value.editor.formatting.enabled = true
  await nextTick()
  await model.redo()
  assert(tab.value.content === 'const x = { a: 1 };\n', 'Redo after enabling failed')
  for (let i = 0; i < 3; i++) {
    settings.value.editor.formatting.enabled = false
    settings.value.editor.formatting.enabled = true
  }
  assert(providers().length === 1, 'repeated toggles duplicated providers')
})
await test('Settings slides formatter controls closed/open while retaining draft values and blocking hidden focus', async () => {
  const modal = document.querySelector('.modal')
  modal.style.display = 'block'
  modal.classList.add('show')
  ;[...modal.querySelectorAll('[role="tab"]')].find(item => item.textContent.trim() === 'Editor').click()
  await nextTick()
  const options = document.querySelector('.settings-formatting-options')
  const frame = () => new Promise(resolve => requestAnimationFrame(resolve))
  const finishTransition = async () => {
    await frame()
    await Promise.all(options.getAnimations().map(animation => animation.finished))
  }
  const expandedHeight = options.getBoundingClientRect().height
  assert(expandedHeight > 100, 'formatter options did not start expanded')
  await frame()
  await frame()
  const change = (id, value) => {
    const control = document.getElementById(id)
    if (control.type === 'checkbox') control.checked = value
    else control.value = value
    control.dispatchEvent(new Event(control.type === 'checkbox' ? 'change' : 'input', { bubbles: true }))
  }
  change('formatting-formatOnSave', true)
  change('formatting-useTabs', true)
  change('formatting-tab-width', '6')
  change('formatting-enabled', false)
  await nextTick()
  const controls = document.querySelectorAll('fieldset input, fieldset select')
  assert(controls.length === 10 && [...controls].every(item => item.matches(':disabled')), 'dependent controls remain enabled')
  assert(!document.getElementById('formatting-enabled').matches(':disabled'), 'enable toggle disabled itself')
  assert(!document.getElementById('editor-theme').matches(':disabled'), 'theme was disabled')
  assert(options.inert && options.getAttribute('aria-hidden') === 'true', 'hidden controls are accessible')
  await frame()
  await frame()
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    assert(options.getAnimations().some(animation => animation.transitionProperty === 'grid-template-rows'), 'slide animation missing')
    assert(options.getBoundingClientRect().height > 0 && options.getBoundingClientRect().height < expandedHeight,
      `height did not animate: ${options.getBoundingClientRect().height} of ${expandedHeight}`)
  }
  await finishTransition()
  assert(options.getBoundingClientRect().height < 1 && getComputedStyle(options).visibility === 'hidden', 'options did not collapse')
  change('formatting-enabled', true)
  await nextTick()
  assert(!options.inert && options.getAttribute('aria-hidden') === 'false', 'restored controls are inaccessible')
  await finishTransition()
  assert(Math.abs(options.getBoundingClientRect().height - expandedHeight) < 1, 'options did not slide open')
  assert([...controls].every(item => !item.matches(':disabled')), 'controls did not recover')
  assert(document.getElementById('formatting-formatOnSave').checked && document.getElementById('formatting-useTabs').checked,
    'checkbox choices were reset')
  assert(document.getElementById('formatting-tab-width').value === '6', 'tab width was reset')
})
app.unmount()
</script></body></html>

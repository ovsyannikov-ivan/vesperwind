[package]
name = "vesperwind-portable"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
flate2 = "=1.1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "=3.0.11"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
